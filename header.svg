<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <!-- The Dark Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>

    <!-- The Sweeping Animation Mask -->
    <mask id="revealMask">
      <rect width="100%" height="100%" fill="black" />
      <g transform="skewX(-25)">
        <!-- The small boxes that create the reveal mask -->
        <rect x="-300" y="-20" width="40" height="240" fill="white">
          <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite" begin="0s" />
        </rect>
        <rect x="-300" y="-20" width="40" height="240" fill="white">
          <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite" begin="0.15s" />
        </rect>
        <rect x="-300" y="-20" width="40" height="240" fill="white">
          <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite" begin="0.3s" />
        </rect>
        <rect x="-300" y="-20" width="40" height="240" fill="white">
          <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite" begin="0.45s" />
        </rect>
      </g>
    </mask>
  </defs>

  <!-- Dark Background Base -->
  <rect width="800" height="200" fill="#0D1117" />
  
  <!-- Apply the Grid Pattern -->
  <rect width="800" height="200" fill="url(#grid)" />

  <!-- Dimmed Base Text -->
  <text x="400" y="115" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="55" fill="#FFFFFF" fill-opacity="0.15" text-anchor="middle">Hi 👋, I'm Bertrand</text>

  <!-- Bright Revealed Text (Only visible when the sweeping boxes pass over) -->
  <text x="400" y="115" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="55" fill="#FFFFFF" text-anchor="middle" mask="url(#revealMask)">Hi 👋, I'm Bertrand</text>

  <!-- === SWEEPING GRAY BOXES === -->
  <g transform="skewX(-25)">
    <!-- Box 1 -->
    <rect x="-300" y="-20" width="40" height="240" fill="transparent" stroke="#8B949E" stroke-width="1.5" rx="2" opacity="0">
      <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="opacity" values="0; 0.6; 0.6; 0" keyTimes="0; 0.1; 0.9; 1" dur="4s" repeatCount="indefinite" begin="0s" />
    </rect>
    
    <!-- Box 2 -->
    <rect x="-300" y="-20" width="40" height="240" fill="transparent" stroke="#8B949E" stroke-width="1.5" rx="2" opacity="0">
      <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite" begin="0.15s" />
      <animate attributeName="opacity" values="0; 0.6; 0.6; 0" keyTimes="0; 0.1; 0.9; 1" dur="4s" repeatCount="indefinite" begin="0.15s" />
    </rect>

    <!-- Box 3 -->
    <rect x="-300" y="-20" width="40" height="240" fill="transparent" stroke="#8B949E" stroke-width="1.5" rx="2" opacity="0">
      <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite" begin="0.3s" />
      <animate attributeName="opacity" values="0; 0.6; 0.6; 0" keyTimes="0; 0.1; 0.9; 1" dur="4s" repeatCount="indefinite" begin="0.3s" />
    </rect>

    <!-- Box 4 -->
    <rect x="-300" y="-20" width="40" height="240" fill="transparent" stroke="#8B949E" stroke-width="1.5" rx="2" opacity="0">
      <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite" begin="0.45s" />
      <animate attributeName="opacity" values="0; 0.6; 0.6; 0" keyTimes="0; 0.1; 0.9; 1" dur="4s" repeatCount="indefinite" begin="0.45s" />
    </rect>
  </g>
</svg>
